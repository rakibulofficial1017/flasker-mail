{% extends "base.html" %}

{% block head %}

<title>Compose Email</title>

<style>
    body {
        margin: 0;
        background-color: #f4f6f8;
        font-family: Arial, sans-serif;
        color: #222;
    }

    .compose-container {
        max-width: 700px;
        margin: 50px auto;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 30px;
    }

    h1 {
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 20px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 15px;
    }

    textarea {
        height: 200px;
        resize: vertical;
    }

    .send-button {
        margin-top: 20px;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .back-button {
        display: inline-block;
        margin-top: 20px;
        color: #555;
        text-decoration: none;
    }

    .back-button:hover {
        color: #000;
    }
    .send-button {
        background-color: #22c55e;
    }

    .send-button:hover {
        background-color: #16a34a;
    }
</style>

{% endblock %}


{% block body %}

<div class="compose-container">

    <h1>Compose Email</h1>

    <form method="POST" action="{{ url_for('compose') }}">

        <label for="recipient">
            To
        </label>

        <input
            type="text"
            id="recipient"
            name="recipient"
            placeholder="Username"
            value="{{ recipient|default('') }}"
            required
        >

        <label for="title">
            Subject
        </label>

        <input
            type="text"
            id="title"
            name="title"
            placeholder="Subject"
            value="{{ title|default('') }}"
            required
        >

        <label for="description">
            Message
        </label>

        <textarea
            id="description"
            name="description"
            placeholder="Write your message..."
            required
        ></textarea>

        <button type="submit" class="send-button">
            Send
        </button>

    </form>

    <a href="{{ url_for('inbox') }}" class="back-button">
        &lt;&lt;&lt; Back to Inbox
    </a>

</div>

{% endblock %}
